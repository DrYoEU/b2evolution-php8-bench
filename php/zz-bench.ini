; Porting bench: show everything, log everything.
error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/bench/php-error.log
html_errors = Off
memory_limit = 512M
post_max_size = 8M
upload_max_filesize = 5M
date.timezone = Europe/Paris
session.upload_progress.enabled = Off
opcache.enable = 0
